name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# POSIX only: the backend relies on dir_fd/openat semantics. Windows is
# unsupported and intentionally not in the matrix.
jobs:
  check:
    name: ${{ matrix.os }} / py${{ matrix.python }} / node 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Ruff
        run: |
          python -m pip install ruff==0.17.1
          ruff check .

      - name: Backend tests (gateway integration tests skip without env)
        run: python -m unittest discover -s tests -t . -v

      - name: Markdown ticket format spike (isolated from the application)
        run: |
          python -m pip install -r spikes/markdown_tickets/requirements.txt
          make test-formats

      - name: UI install
        run: npm ci
        working-directory: ui

      - name: UI typecheck
        run: npm run typecheck
        working-directory: ui

      - name: UI tests (builds the bundle first)
        run: npm test
        working-directory: ui

      - name: Committed ui/dist matches a fresh build
        run: |
          git diff --exit-code -- ui/dist
          test -z "$(git ls-files --others --exclude-standard -- ui/dist)"
