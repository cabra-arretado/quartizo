# Tooling config only. The backend is not a Python package; its only third-party
# code is the hash-pinned parsers vendored unchanged in backend/_vendor.
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["ui", "backend/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501: long lines are docstrings and test strings; wrapping is the formatter's
# job and the formatter is not enforced (it would reformat ~24% of lines).
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
